name: publish-client

on:
  push:
    tags: ["v*"]

jobs:
  osv:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
    with:
      fail-on-vuln: true
      scan-args: |-
        -r
        ./
    permissions:
      actions: read
      contents: read
      security-events: write

  pypi:
    needs: [osv]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --all-packages
      # Workspace root owns dist/ (also used for C++ zips); build/publish must use an explicit out-dir.
      - name: Build and publish to PyPI
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          uv build --package airbus-client --out-dir "$out"
          ls -la "$out"
          # Requires a PyPI Trusted Publisher for ghhwer/airbus → publish-client.yml (env: pypi).
          # Pending publishers work before the project exists: https://docs.pypi.org/trusted-publishers/
          uv publish --trusted-publishing always "$out"/*
