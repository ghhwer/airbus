name: publish-client

on:
  push:
    tags: ["v*"]

jobs:
  osv:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
    with:
      fail-on-vuln: true
      scan-args: |-
        -r
        ./
    permissions:
      actions: read
      contents: read
      security-events: write

  pypi:
    needs: [osv]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --all-packages
      - working-directory: client-py
        run: uv build
      - working-directory: client-py
        run: uv publish
