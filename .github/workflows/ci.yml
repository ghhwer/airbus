name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Require this check on main (Settings → Branches → Require status checks → uv-lock-check).
  # Ensures the lock is in sync and only references public PyPI hosts (not Verigate).
  uv-lock-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Check uv.lock is up to date
        env:
          UV_INDEX_URL: ""
          UV_EXTRA_INDEX_URL: ""
          UV_DEFAULT_INDEX: ""
        run: |
          set -euo pipefail
          unset UV_INDEX_URL UV_EXTRA_INDEX_URL UV_DEFAULT_INDEX || true
          uv lock --check
      - name: Assert public PyPI registries only
        run: |
          set -euo pipefail
          # Fail on any registry/URL host in uv.lock that is not public PyPI.
          bad="$(
            grep -Eho 'https?://[^/"'"'"' ]+' uv.lock \
              | sed -E 's#https?://##' \
              | cut -d/ -f1 \
              | sort -u \
              | grep -Ev '^(pypi\.org|files\.pythonhosted\.org)$' \
              || true
          )"
          if [ -n "${bad}" ]; then
            echo "::error::uv.lock references non-public hosts:"
            echo "${bad}"
            exit 1
          fi
          echo "All uv.lock hosts are public PyPI"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test -p airbus
      - run: cargo audit
      - run: node tests/protocol.test.mjs

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        id: typify-cache
        with:
          path: ~/.cargo/bin/cargo-typify
          key: cargo-typify-0.8.0-${{ runner.os }}
      - name: Install cargo-typify
        if: steps.typify-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --version 0.8.0 cargo-typify
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: make build
      - run: uv sync --all-packages
      - run: uv run python scripts/check_protocol_boundaries.py
      - run: uv run python scripts/generate_payloads.py --check
      - run: cd client-py && AIRBUS_BIN="$GITHUB_WORKSPACE/out/airbus" uv run pytest
      - name: Rust client integration tests
        run: AIRBUS_BIN="$GITHUB_WORKSPACE/out/airbus" cargo test -p airbus-client

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - run: docker build -t airbus:ci .
      - name: Audit image binary
        run: |
          set -euo pipefail
          cid="$(docker create airbus:ci)"
          docker cp "${cid}:/airbus" ./airbus-ci
          docker rm "${cid}"
          cargo audit bin ./airbus-ci

  client-embedded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Pack Arduino/ESP32 release asset
        run: python scripts/pack_embedded_client.py --out-dir dist
      - name: Check Arduino/ESP32 asset layout
        run: |
          version="$(tr -d '[:space:]' < client-embedded/VERSION)"
          unzip -l "dist/airbus-client-arduino-esp32-v${version}.zip" | grep -E 'library.json|include/airbus/embedded_rpc.h|include/airbus/embedded_listener.h|include/airbus/payloads.h|src/embedded_rpc.cpp'
          ! unzip -l "dist/airbus-client-arduino-esp32-v${version}.zip" | grep -qi 'nlohmann\|transport_posix\|contracts.cpp\|CMakeLists'
          ! test -f "dist/airbus-client-cpp-v${version}.zip"
          ! test -f "dist/airbus-client-desktop-pio-v${version}.zip"
