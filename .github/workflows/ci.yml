name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - run: node tests/protocol.test.mjs

  client-py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        id: typify-cache
        with:
          path: ~/.cargo/bin/cargo-typify
          key: cargo-typify-0.8.0-${{ runner.os }}
      - name: Install cargo-typify
        if: steps.typify-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --version 0.8.0 cargo-typify
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: make build
      - run: uv sync --all-packages
      - run: uv run python scripts/check_protocol_boundaries.py
      - run: uv run python scripts/generate_payloads.py --check
      - run: cd client-py && AIRBUS_BIN="$GITHUB_WORKSPACE/out/airbus" uv run pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t airbus:ci .

  client-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Pack release assets
        run: python scripts/pack_cpp_clients.py --out-dir dist
      - name: Configure and build C++ client from packed asset
        run: |
          version="$(tr -d '[:space:]' < client-cpp/VERSION)"
          unzip -q "dist/airbus-client-cpp-v${version}.zip" -d /tmp
          cmake -S "/tmp/airbus-client-cpp-v${version}" -B /tmp/airbus-cpp-build \
            -DAIRBUS_CLIENT_BUILD_EXAMPLES=ON \
            -DAIRBUS_CLIENT_BUILD_TESTS=OFF \
            -DAIRBUS_CLIENT_FETCH_JSON=OFF
          cmake --build /tmp/airbus-cpp-build
      - name: Check PlatformIO asset layout
        run: |
          version="$(tr -d '[:space:]' < client-cpp/VERSION)"
          unzip -l "dist/airbus-client-pio-v${version}.zip" | grep -E 'library.json|include/airbus/client.hpp|third_party/nlohmann/json.hpp|transport_posix.cpp'
          ! unzip -l "dist/airbus-client-pio-v${version}.zip" | grep -qi arduino
          unzip -l "dist/airbus-client-cpp-v${version}.zip" | grep transport_posix.cpp
      - name: Build daemon and run C++ client tests
        run: make test-client-cpp
