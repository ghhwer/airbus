[project]
name = "airbus-client"
version = "0.1.0"
description = "Python test client for the Airbus Rust binary"
requires-python = ">=3.13"
dependencies = ["jsonschema>=4.26.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airbus_client"]

[[tool.uv.index]]
name = "verigate"
url = "https://verigate.internal.com.br/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "datamodel-code-generator==0.78.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
