[package]
name = "airbus"
version = "0.1.0"
edition = "2021"
description = "JSON-RPC over TCP binary with in-process event queues"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "airbus"
path = "src/lib.rs"

[[bin]]
name = "airbus"
path = "src/main.rs"
