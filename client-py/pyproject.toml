[project]
name = "airbus-client"
version = "0.1.1"
description = "Python client for the Airbus JSON-RPC event bus"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = []
authors = [{ name = "Airbus contributors" }]
urls = { Homepage = "https://github.com/ghhwer/airbus", Repository = "https://github.com/ghhwer/airbus" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airbus_client"]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.78.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
